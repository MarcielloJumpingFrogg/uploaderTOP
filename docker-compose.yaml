services:
  db:
    image: postgres
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: password123
      POSTGRES_USER: user123
      POSTGRES_DB: db123
    ports:
      - 2345:5432
    networks:
        - appnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user123 -d db123"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  app:
    build: .
    ports:
      - 8080:8080
    depends_on:
      db:
        condition: service_healthy
    network_mode: host
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3 
      start_period: 40s

networks:
  appnet:
    driver: bridge   # Specify driver options
   # driver_opts:
   #   com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
